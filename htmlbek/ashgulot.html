<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            transition: 1s;
        }
        
        .tepa {
            width: 100%;
            height: 70px;
            background-color: darkgrey;
            position: relative;
        }

        .birga {
            width: 90%;
            height: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 20px;
            left: 50px;
        }

        .open-btn {
            width: 50px;
            height: 25px;
            background-color: blue;
        }

        
        .modal {
            background-color: rgba(0, 0, 0, 0.5);
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            width: 300px;
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            background-color: white;
        }
        .modal.active {
            display: flex;
        }
    </style>
</head>
<body>
    <div class="tepa">
        <div class="birga">
            <div class="my">
                <h4>MyWebsite</h4>
            </div>

            <div class="ikki">
                <button class="open-btn">sign-up</button>
            </div>
        </div>
    </div>
    <div class="modal">
        <form class="modal-content">
            <label for="ism">Ismingizni yozing</label>
            <input type="text" name="ism" id="ism">
            <label for="parol">Parolingizni kiriting</label>
            <input type="password" name="parol" id="parol">
            <button class="send">Yuborish</button>
            <button class="class-btn">Yopish</button>
        </form>
    </div>

    <script>
        const openBtn = document.querySelector(".open-btn")
        const closeBtn = document.querySelector(".class-btn")
        const modal = document.querySelector(".modal")

        openBtn.addEventListener("click", () =>{
            modal.classList.add ("active");
        })

        clossBtn.addEventListener("click", () =>{
            modal.classList.remove("active");
        })
    </script>
</body>
</html>
