<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
    * {
        margin: 0;
        padding: 0;
    }
    .barcha {
        width: 1920px;
        height: 1080px;
        background-color: #FFD1B0;
        margin-left: 550px;
        margin-top: 250px;
        position: relative;
    }

    .birga {
        width: 1366px;
        height: 768px;
        position: absolute;
        top: 156px;
        left: 277px;
        border-radius: 24px;
        background-color: #FEDCC5;
    }

    .kirish {
        width: 455px;
        height: 600px;
        background-color: #FFFFFF4D;
        border-radius: 24px;
        margin-top: 84.19px;
        margin-left: 96px;
        position: relative;
    }

    .logo {
        width: 78px;
        height: 22px;
        position: absolute;
        top: 49px;
        left: 56px; 
        color: #F25019;
    }

    .Login {
        width: 121px;
        height: 59px;
        position: absolute;
        margin-left: 56px;
        margin-top: 71px;
        font-size: 23px;
        color: #333333;
    }

    .gmaillar {
        width: 335px;
        height: 64px;
        position: absolute;
        top: 154px;
        left: 56px;
    }

    .email {
        width: 32px;
        height: 16px;
    }

    .user {
        width: 335px;
        height: 40px;
        border-radius: 4px;
        position: absolute;
        margin-top: 8px;
        background-color: #FFFFFF;
    }

    .ichida {
        width: 132px;
        height: 16px;
        margin-left: 16px;
        margin-top: 12px;
        color: #BFBFBF;
    }

    .gmaillar2 {
        width: 335px;
        height: 64px;
        position: absolute;
        top: 234px;
        left: 56px;
    }

    .forgot {
        width: 125px;
        height: 17px;
        position: absolute;
        top: 314px;
        left: 266px;
        color: #AE4700;
    }

    .sign {
        width: 335px;
        height: 32px;
        border-radius: 3.56px;
        background-color: #F25019;
        position: absolute;
        top: 363px;
        left: 56px;
    }

    .in {
        width: 45px;
        height: 18px;
        margin-left: 145px;
        margin-top: 7px;
        color: #FFFFFF;
    }

    .with {
        width: 112px;
        height: 17px;
        position: absolute;
        top: 419px;
        left: 167px;
        color: #333333;
    }

    .uch {
        width: 250px;
        height: 35px;
        border: 1px solid red;
        position: absolute;
        top: 460px;
        left: 98px;
        display: flex;
        
    }

    .google {
        width: 72.66666412353516px;
        height: 35px;
        border-radius: 28.46px;
        background-color: #FFFFFF;
        justify-content: space-around;
    }
    </style>
</head>
<body>
    <div class="barcha">
        <div class="birga">
            <div class="kirish">
                <div class="logo">
                    <h3>Your logo</h3>
                </div>

                <div class="Login">
                    <h1>Login</h1>
                </div>

                <div class="gmaillar">
                    <div class="email">
                        <p>Email</p>
                    </div>

                    <div class="user">
                        <div class="ichida">
                            <p>username@gmail.com</p>
                        </div>
                    </div>
                </div>

                <div class="gmaillar2">
                    <div class="email">
                        <p>Password</p>
                    </div>

                    <div class="user">
                        <div class="ichida">
                            <p>Password</p>
                        </div>
                    </div>
                </div>

                <div class="forgot">
                    <h4>Forgot Password?</h4>
                </div>

                <div class="sign">
                    <div class="in">
                        <h5>Sign in</h5>
                    </div>
                </div>

                <div class="with">
                    <h5>Or Continue With</h5>
                </div>

                <div class="uch">
                    <div class="google">
                        <i class="fa-brands fa-google" style="color: rgb(0, 0, 0);"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
